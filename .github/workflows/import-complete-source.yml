name: Import complete LDFA source

on:
  push:
    branches:
      - import/ldfa-v0.9-source
    paths:
      - .github/workflows/import-complete-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout LDFA import branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: import/ldfa-v0.9-source
          fetch-depth: 0
          persist-credentials: true

      - name: Import the completed implementation
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="187dac161e773a7fb7e7ddea914149a150bd0b1e"
          git remote add source https://github.com/hatake716/Linux-Desktop-for-Android.git
          git fetch --depth=1 source "$SOURCE_COMMIT"

          # Check out the exact source tree into the current repository. This preserves
          # executable modes and the pinned Termux / Termux:X11 gitlink entries.
          git checkout "$SOURCE_COMMIT" -- .

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("README.md"),
              Path("THIRD_PARTY_NOTICES.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/INSTALLATION.md"),
              Path("docs/OVERVIEW.md"),
              Path("docs/TESTING.md"),
          ]

          for path in paths:
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "https://github.com/hatake716/Linux-Desktop-for-Android.git",
                  "https://github.com/hatake716/LDFA.git",
              )
              text = text.replace(
                  "git clone --recurse-submodules <repository>",
                  "git clone --recurse-submodules https://github.com/hatake716/LDFA.git",
              )
              text = text.replace("cd Linux-Desktop-for-Android", "cd LDFA")
              path.write_text(text, encoding="utf-8")
          PY

          # Remove this one-time workflow from the imported source tree.
          git rm -- .github/workflows/import-complete-source.yml
          git add -- \
            README.md \
            THIRD_PARTY_NOTICES.md \
            docs/ARCHITECTURE.md \
            docs/INSTALLATION.md \
            docs/OVERVIEW.md \
            docs/TESTING.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status --short
          git commit -m "Import complete LDFA v0.9 implementation"
          git push origin HEAD:import/ldfa-v0.9-source
