plugins {
    id 'com.android.library'
}

android {
    namespace 'com.termux.x11'
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion project.properties.ndkVersion

    defaultConfig {
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        minSdkVersion 26
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        buildConfigField 'String', 'VERSION_NAME', '"1.03.01-embedded"'
        buildConfigField 'String', 'COMMIT', '"50ac80fb2d4a475e323e752d17fcc0483c3c99fc"'
        // Must match :app's applicationId. Lorie's PrefsProto calls
        // createPackageContext(APPLICATION_ID) at viewer startup, so a stale
        // value here crashes MainActivity with NameNotFoundException.
        buildConfigField 'String', 'APPLICATION_ID', '"com.hatake716.linuxdesktop"'
        consumerProguardFiles 'proguard-rules.pro'
    }

    sourceSets {
        main {
            // Generate a reproducible embedded variant instead of relying on a dirty submodule.
            // This normalizes JNI annotations and removes the obsolete TCP reconnect path.
            java.srcDirs = [
                'build/generated/upstream-java',
                'src/main/java',
                'build/generated/java'
            ]
            res.srcDirs = [
                'build/generated/embedded-res',
                'src/main/res'
            ]
            aidl.srcDirs = [
                '../vendor/termux-x11/lorie/src/main/aidl'
            ]
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            // Keep the upstream submodule pristine and replace only embedded-sensitive native
            // translation units from a generated build directory.
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    lint {
        disable 'AppCompatCustomView'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'
    compileOnly project(':shell-loader-stub')
}

tasks.register('generatePrefs') {
    doLast {
        def source = file('../vendor/termux-x11/lorie/src/main/res/xml/preferences.xml')
        def xml = groovy.xml.DOMBuilder.parse(new StringReader(source.text))
        def preferenceNodes = xml.documentElement.getElementsByTagName('*')
        def preferences = []

        for (int i = 0; i < preferenceNodes.length; i++) {
            def node = preferenceNodes.item(i)
            if (node.nodeName == 'EditTextPreference' && node.getAttribute('app:key') != 'extra_keys_config')
                preferences << [type: 'String', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
            else if (node.nodeName == 'SeekBarPreference')
                preferences << [type: 'Int', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
            else if (node.nodeName == 'ListPreference') {
                def entries = node.getAttribute('app:entries')
                def values = node.getAttribute('app:entryValues')
                preferences << [
                    type: 'List',
                    key: node.getAttribute('app:key'),
                    default: node.getAttribute('app:defaultValue'),
                    entries: entries.substring(7),
                    values: values.substring(7)
                ]
            } else if (node.nodeName == 'SwitchPreferenceCompat')
                preferences << [type: 'Boolean', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
        }

        def out = file('build/generated/java/com/termux/x11/Prefs.java')
        out.parentFile.mkdirs()
        out.text = 'package com.termux.x11;\n' +
            'import java.util.HashMap;\n' +
            'import android.content.Context;\n' +
            'import android.content.SharedPreferences;\n' +
            'import com.termux.x11.utils.TermuxX11ExtraKeys;\n\n' +
            'public class Prefs extends LoriePreferences.PrefsProto {\n'

        preferences.each {
            if (it.type == 'Int' || it.type == 'Boolean')
                out << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", ${it.default});\n"
            else if (it.type == 'String')
                out << "  public final StringPreference ${it.key} = new StringPreference(\"${it.key}\", \"${it.default}\");\n"
            else if (it.type == 'List')
                out << "  public final ListPreference ${it.key} = new ListPreference(\"${it.key}\", \"${it.default}\", R.array.${it.entries}, R.array.${it.values});\n"
        }

        out << '  public final StringPreference extra_keys_config = new StringPreference("extra_keys_config", TermuxX11ExtraKeys.DEFAULT_IVALUE_EXTRA_KEYS);\n'
        out << '  public final HashMap<String, Preference> keys = new HashMap<>() {{\n'
        preferences.each { out << "    put(\"${it.key}\", ${it.key});\n" }
        out << '    put("extra_keys_config", extra_keys_config);\n'
        out << '  }};\n\n'
        out << '  public Prefs(Context ctx) {\n'
        out << '    super(ctx);\n'
        out << '    for (SharedPreferences store : new SharedPreferences[]{ builtInDisplayPreferences, secondaryDisplayPreferences }) {\n'
        out << '      Object legacyKeepScreenOn = store.getAll().get("keepScreenOn");\n'
        out << '      if (legacyKeepScreenOn instanceof Boolean && !store.contains("screenIdleTimeout"))\n'
        out << '        store.edit().putString("screenIdleTimeout", (Boolean) legacyKeepScreenOn ? "never" : "system").commit();\n'
        out << '    }\n'
        out << '  }\n'
        out << '}\n'
    }
}

def prepareEmbeddedJava = tasks.register('prepareEmbeddedJava', Exec) {
    def upstreamJava = file('../vendor/termux-x11/lorie/src/main/java')
    def generatedJava = file('build/generated/upstream-java')
    inputs.dir(upstreamJava)
    inputs.file('scripts/prepare_embedded_java.py')
    inputs.dir('../vendor/termux-x11/lorie/src/main/res')
    outputs.dir(generatedJava)
    outputs.dir('build/generated/embedded-res')
    commandLine 'python3', file('scripts/prepare_embedded_java.py'), upstreamJava, generatedJava, file('build/generated/embedded-res')
}

preBuild.dependsOn tasks.named('generatePrefs'), prepareEmbeddedJava
